name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Escribe APPLY para crear la demo de MediBook en AWS
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    environment: medibook-demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package Lambda
        run: python scripts/package_lambda.py
      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=medibook/demo/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Plan
        working-directory: infra
        run: terraform plan -out=tfplan
      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
      - name: Show URLs
        working-directory: infra
        run: terraform output
      - name: Save apply log
        if: always()
        run: echo "Apply run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

